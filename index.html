<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bitcoin Protocol Explorer · Learn how Bitcoin works, block by block</title>
    <meta name="description" content="Watch Bitcoin work, transaction by transaction. Interactive lessons on UTXOs, scripts, blocks, proof of work, consensus, the P2P network, keys and Lightning — with every byte decoded." />
    <meta name="theme-color" content="#fbfcff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Bitcoin Protocol Explorer" />
    <meta property="og:description" content="Learn how Bitcoin works, block by block. Interactive protocol lessons with byte-level transaction decoding, proof-of-work mining and real cryptographic labs." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem('btc-explorer:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="margin: 40px; font: 16px/1.5 ui-monospace, monospace; color: #00238a">
        This explorer animates transactions and blocks as they move through the network. Please enable JavaScript to start the lessons.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
